<!DOCTYPE html>
<html>
<head>
    <title>Rental Laptop</title>
</head>
<body style="background-color: lightblue; font-family: Arial; text-align: center; padding-top: 50px;">

    <h2>Rental Laptop</h2>
    <p>Silakan isi form di bawah untuk mencari laptop yang tersedia</p>

    <form>
        <label>Tanggal Pinjam:</label><br>
        <select>
            <option>-- Pilih Tanggal --</option>
            <option>Hari Ini</option>
            <option>Besok</option>
        </select>
        <br><br>

        <label>Tempat Kembali:</label><br>
        <select>
            <option>-- Pilih Tempat --</option>
            <option>Yogyakarta</option>
            <option>Surabaya</option>
        </select>
        <br><br>

        <label>Nama Laptop:</label><br>
        <input type="text" placeholder="Masukkan nama laptop">
        <br><br>

        <button type="submit">Cari Sekarang</button>
    </form>

</body>
</html>
