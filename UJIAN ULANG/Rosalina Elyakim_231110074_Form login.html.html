<!DOCTYPE html>
<html>
<head>
  <title>Login Page</title>
  <style>
    body {
      background: linear-gradient(to right, #1a73e8, #4285f4);
      font-family: Arial, sans-serif;
      text-align: center;
      color: white;
    }
    .login-container {
      background-color: rgba(255, 255, 255, 0.9);
      padding: 30px;
      border-radius: 10px;
      width: 300px;
      margin: 100px auto;
      color: black;
    }
    input {
      width: 90%;
      padding: 8px;
      margin: 8px 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .login-btn {
      background-color: orange;
      color: white;
      border: none;
      padding: 10px;
      width: 95%;
      cursor: pointer;
      border-radius: 5px;
    }
    .link {
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h2>Form Login</h2>
  <p>Dibuat oleh: Rosalina<br>NIM: 231110074</p>
  <div class="login-container">
    <form>
      <label>Username:</label><br>
      <input type="text"><br>
      <label>Password:</label><br>
      <input type="password"><br>
      <button class="login-btn">Login</button>
    </form>
    <p class="link">Belum punya akun? <a href="#">Daftar sekarang</a></p>
  </div>
</body>
</html>
